<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modus console</title>
<style>
  /* The colors of the Modus palette: each tone and each kind of code is a
     class, so a change of theme colors every line again. */
  :root { color-scheme: dark; --bg: #14171d; --surface: #1c2029; --edge: #2b313e; --text: #e6ebf2; --dim: #7c8a99; --strong: #ffffff;
    --good: #58d878; --warning: #e0a040; --bad: #f06060; --accent: #64aaf2; --number: #38c0b0;
    --code-name: #58d878; --code-type: #9e8fcb; --code-literal: #38c0b0; --code-punctuation: #b0b8c1; --code-comment: #9ca6b2;
    --chosen: rgba(100, 170, 242, 0.16); --shadow: 0 12px 32px rgba(0, 0, 0, 0.45); }
  [data-theme="light"] { color-scheme: light; --bg: #f6f7f9; --surface: #ffffff; --edge: #dde1e7; --text: #181c22; --dim: #4a525b; --strong: #000000;
    --good: #327c45; --warning: #906729; --bad: #ba4a4a; --accent: #3c76bb; --number: #247c71;
    --code-name: #276035; --code-type: #554a75; --code-literal: #1b5f57; --code-punctuation: #3d444c; --code-comment: #4a525b;
    --chosen: rgba(60, 118, 187, 0.12); --shadow: 0 12px 32px rgba(24, 28, 34, 0.16); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--edge); font-size: 12px; }
  #badge { font-weight: 700; color: var(--accent); }
  #state { display: flex; align-items: center; gap: 6px; color: var(--dim); margin-right: auto; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
  #dot.running { background: var(--good); }
  #dot.stopped { background: var(--bad); }
  button { font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--edge); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
  #output { flex: 1; overflow-y: auto; padding: 12px 14px 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line { min-height: 1.45em; }
  #status-bar { display: flex; align-items: center; gap: 10px; padding: 4px 14px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--edge); }
  #status-track { flex: 0 0 160px; height: 4px; border-radius: 2px; background: var(--edge); overflow: hidden; }
  #status-fill { height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
  #prompt-area { position: relative; padding: 8px 14px 6px; background: var(--surface); border-top: 1px solid var(--edge); }
  #prompt-bar { white-space: pre; overflow-x: auto; min-height: 1.45em; outline: none; cursor: text; }
  .caret { display: inline-block; width: 0; height: 1.2em; margin-right: -2px; vertical-align: text-bottom; border-left: 2px solid var(--accent); animation: blink 1.1s steps(1) infinite; }
  #prompt-bar:not(:focus) .caret { animation: none; opacity: 0.4; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  #hint-bar { min-height: 1.45em; font-size: 12px; color: var(--dim); white-space: pre-wrap; }
  .mark { color: var(--accent); font-weight: 700; }
  #completion-popup { position: absolute; bottom: 100%; margin-bottom: 6px; min-width: 260px; max-width: min(640px, calc(100vw - 16px)); padding: 4px 0; background: var(--surface); border: 1px solid var(--edge); border-radius: 6px; box-shadow: var(--shadow); }
  .item { display: flex; gap: 10px; align-items: baseline; padding: 2px 10px; white-space: pre; cursor: pointer; }
  .item:hover { background: var(--chosen); }
  .item.chosen { background: var(--chosen); box-shadow: inset 2px 0 var(--accent); }
  .icon { min-width: 7ch; padding: 0 5px; font-size: 10px; text-align: center; color: var(--dim); border: 1px solid var(--edge); border-radius: 3px; }
  .detail { overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .matched { color: var(--accent); font-weight: 700; }
  #list-count { margin-top: 4px; padding: 2px 10px 0; font-size: 11px; text-align: right; color: var(--dim); border-top: 1px solid var(--edge); }
  #chips { display: flex; gap: 8px; padding: 0 14px 8px; background: var(--surface); }
  [hidden] { display: none !important; }
  .t-dim { color: var(--dim); } .t-strong { color: var(--strong); font-weight: 700; } .t-good { color: var(--good); } .t-warning { color: var(--warning); }
  .t-bad { color: var(--bad); } .t-accent { color: var(--accent); } .t-number { color: var(--number); }
  .c-function { color: var(--code-name); } .c-type { color: var(--code-type); } .c-number, .c-text, .c-text_unfinished { color: var(--code-literal); }
  .c-operator, .c-arrow { color: var(--code-punctuation); } .c-words, .c-unknown { color: var(--code-comment); }
</style>
</head>
<body>
<header>
  <span id="badge">modus</span>
  <span id="state"><span id="dot"></span><span id="state-text">loading</span></span>
  <button id="theme" type="button">Light</button>
  <button id="clear" type="button">Clear</button>
</header>
<main id="output" aria-live="polite" aria-label="output"></main>
<div id="status-bar" hidden><span id="status-text"></span><span id="status-track"><span id="status-fill"></span></span><span id="status-count"></span></div>
<div id="prompt-area">
  <div id="completion-popup" role="listbox" hidden></div>
  <div id="prompt-bar" tabindex="0" role="textbox" aria-label="modus console"></div>
  <div id="hint-bar"></div>
</div>
<div id="chips" hidden></div>
<script type="module">
import { BrowserMachine, MachineState } from "./browser_machine_host.js";

// The page draws the lines that dom_terminal writes on COM2, one JSON
// object for each line (src/md/features/console_renderers.md, "Variant C:
// dom_terminal"). Each place in a text is a place in Array.from(text).
const OUTPUT_LINE_LIMIT = 4000;
const STARTERS = ["help()", "processes()", "log.follow()"];
const THEME_KEY = "modus-console-theme";
const element = (id) => document.getElementById(id);
const output = element("output"), promptBar = element("prompt-bar"), hintBar = element("hint-bar"), popup = element("completion-popup"), chips = element("chips");

function span(text, className) {
  const node = document.createElement("span");
  node.textContent = text;
  if (className) node.className = className;
  return node;
}
function kindAt(runs, place) {
  for (const [start, end, kind] of runs ?? []) if (place >= start && place < end) return "c-" + kind;
  return "";
}
// appendParts appends characters from..to of chars, one span for each run
// of characters with the same class.
function appendParts(parent, chars, from, to, classOf) {
  let start = from;
  for (let place = from + 1; place <= to; place++) {
    if (place === to || classOf(place) !== classOf(start)) {
      parent.append(span(chars.slice(start, place).join(""), classOf(start)));
      start = place;
    }
  }
}

function themeSet(theme) {
  document.documentElement.dataset.theme = theme;
  element("theme").textContent = theme === "dark" ? "Light" : "Dark";
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
}
let savedTheme = "dark";
try { savedTheme = localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch {}
themeSet(savedTheme);
element("theme").addEventListener("click", () => themeSet(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

let openLine = null;
function clearOutput() { output.replaceChildren(); openLine = null; }
element("clear").addEventListener("click", clearOutput);

let listChosen = -1;
const records = {
  out(record) {
    if (!openLine) {
      openLine = document.createElement("div");
      openLine.className = "line";
      output.append(openLine);
      while (output.childElementCount > OUTPUT_LINE_LIMIT) output.firstElementChild.remove();
    }
    const node = span(record.s, [record.tone && "t-" + record.tone, record.code && "c-" + record.code].filter(Boolean).join(" "));
    if (record.fg) node.style.color = record.fg;
    if (record.rev) { node.style.background = record.fg ?? "var(--text)"; node.style.color = "var(--bg)"; }
    openLine.append(node);
    if (record.nl) openLine = null;
  },
  clr: clearOutput,
  edit(record) {
    const chars = Array.from(record.text), classOf = (place) => kindAt(record.runs, place);
    promptBar.replaceChildren();
    if (record.cur === undefined) appendParts(promptBar, chars, 0, chars.length, classOf);
    else {
      appendParts(promptBar, chars, 0, record.cur, classOf);
      promptBar.append(span("", "caret"));
      appendParts(promptBar, chars, record.cur, chars.length, classOf);
    }
    chips.hidden = !/^>\s*$/.test(record.text);
  },
  hint(record) {
    const chars = Array.from(record.text), start = record.ms ?? 0, end = start + (record.ml ?? 0);
    hintBar.replaceChildren();
    appendParts(hintBar, chars, 0, chars.length, (place) => (place >= start && place < end ? "mark" : ""));
  },
  status(record) {
    element("status-bar").hidden = !(record.tot > 0);
    if (!(record.tot > 0)) return;
    element("status-text").textContent = record.text;
    element("status-fill").style.width = Math.min(100, (100 * record.v) / record.tot) + "%";
    element("status-count").textContent = record.v + " / " + record.tot;
  },
  list(record) {
    popup.replaceChildren();
    popup.hidden = record.items.length === 0;
    listChosen = record.chosen;
    if (popup.hidden) return;
    record.items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "item" + (index === record.chosen ? " chosen" : "");
      row.setAttribute("role", "option");
      if (item.icon) row.append(span(item.icon.replace("_", " "), "icon"));
      const chars = Array.from(item.name + item.detail), nameLength = Array.from(item.name).length, matched = new Set(item.match ?? []);
      const name = span("", "name"), detail = span("", "detail");
      appendParts(name, chars, 0, nameLength, (place) => (matched.has(place) ? "matched" : kindAt(item.runs, place)));
      appendParts(detail, chars, nameLength, chars.length, (place) => kindAt(item.runs, place));
      row.append(name, detail);
      // The console moves its choice by the arrows and takes it by Tab: a
      // click sends the keys that choose its row.
      row.addEventListener("mousedown", (event) => {
        event.preventDefault();
        const step = index - listChosen;
        send((step > 0 ? "\x1b[B" : "\x1b[A").repeat(Math.abs(step)) + "\t");
        promptBar.focus();
      });
      popup.append(row);
    });
    if (record.total > record.items.length) {
      const count = document.createElement("div");
      count.id = "list-count";
      count.textContent = record.first + 1 + "–" + (record.first + record.items.length) + " / " + record.total;
      popup.append(count);
    }
    // The list starts at the column of the name, inside the window.
    const probe = span("0".repeat(10));
    promptBar.append(probe);
    const columnWidth = probe.getBoundingClientRect().width / 10;
    probe.remove();
    const left = 14 + record.start * columnWidth - promptBar.scrollLeft;
    popup.style.left = Math.max(8, Math.min(left, window.innerWidth - popup.offsetWidth - 8)) + "px";
  },
};

for (const command of STARTERS) {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.textContent = command;
  chip.addEventListener("click", () => { send(command + "\r"); promptBar.focus(); });
  chips.append(chip);
}

function stateSet(text) {
  element("state-text").textContent = text;
  element("dot").className = text === "running" ? "running" : text === "starting" || text === "loading" ? "" : "stopped";
}

const [kernelResponse, imageResponse] = await Promise.all([fetch("./modulus_kernel.wasm"), fetch("./console.image")]);
const kernelModule = await WebAssembly.compile(await kernelResponse.arrayBuffer());
const bootImage = new Uint8Array(await imageResponse.arrayBuffer());
const machine = new BrowserMachine({
  kernelModule, bootImage, memoryMebibytes: 256, framebufferWidth: 0, framebufferHeight: 0,
  clockNanoseconds: () => BigInt(Math.round(performance.now() * 1e6)),
  idleWait: () => {},
  // COM1 is the log of the kernel: the console of the developer shows it.
  onSerialLine: (line) => console.log(line),
  onConsoleLine: (line) => {
    let record;
    try { record = JSON.parse(line); } catch { return; }
    records[record.t]?.(record);
  },
});
// send gives text to COM2 as a terminal sends it: UTF-8 and VT100 keys,
// which dom_terminal decodes.
function send(text) { machine.consolePort.type(text); }

const NAMED_KEYS = { ArrowUp: "\x1b[A", ArrowDown: "\x1b[B", ArrowRight: "\x1b[C", ArrowLeft: "\x1b[D", Home: "\x1b[H", End: "\x1b[F", Delete: "\x1b[3~", PageUp: "\x1b[5~", PageDown: "\x1b[6~", Enter: "\r", Backspace: "\x7f", Escape: "\x1b" };
document.addEventListener("keydown", (event) => {
  if (event.target instanceof HTMLButtonElement && (event.key === "Enter" || event.key === " ")) return;
  // Cmd and Alt stay with the browser; Ctrl+C with a selection copies it,
  // and Ctrl+V comes as a paste.
  if (event.metaKey || event.altKey) return;
  const letter = event.key.length === 1 ? event.key.toLowerCase() : "";
  if (event.ctrlKey && ((letter === "c" && String(getSelection())) || letter === "v")) return;
  let sequence = event.key === "Tab" ? (event.shiftKey ? "\x1b[Z" : "\t") : NAMED_KEYS[event.key];
  if (!sequence && event.ctrlKey && letter >= "a" && letter <= "z") sequence = String.fromCharCode(letter.charCodeAt(0) - 96);
  else if (!sequence && !event.ctrlKey && event.key.length >= 1 && Array.from(event.key).length === 1) sequence = event.key;
  if (!sequence) return;
  event.preventDefault();
  send(sequence);
});
document.addEventListener("paste", (event) => {
  const text = event.clipboardData?.getData("text/plain");
  if (!text) return;
  event.preventDefault();
  send(text.replace(/\r\n?|\n/g, "\r"));
});
promptBar.addEventListener("mousedown", () => promptBar.focus());

stateSet("starting");
await machine.start();
stateSet("running");
promptBar.focus();

function step() {
  if (machine.state !== MachineState.Running) { stateSet(machine.state); return; }
  // Output follows the end only when the reader is at the end.
  const atEnd = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
  machine.runSlice(8_000_000);
  if (atEnd) output.scrollTop = output.scrollHeight;
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
