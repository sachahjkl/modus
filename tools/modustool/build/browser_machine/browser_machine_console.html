<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Console - modus</title>
<meta name="description" content="Run the modus console directly in the browser on the WebAssembly kernel.">
<link rel="icon" href="./favicon.ico" sizes="32x32">
<link rel="stylesheet" href="./browser_machine.css">
</head>
<body class="page-console">
<header class="site-bar">
  <div class="site-bar-inner">
    <a class="brand-link" href="./"><span class="brand-mark" aria-hidden="true"></span>modus</a>
    <nav class="site-nav" aria-label="Site">
      <a class="nav-link" href="./try/">Try</a>
      <a class="nav-link" href="./browser_machine_console.html" aria-current="page">Web Console</a>
      <a class="nav-link" href="./browser_machine.html">Web Desktop</a>
    </nav>
    <div id="state" class="bar-status" role="status">
      <span id="dot" class="status-dot"></span>
      <span id="state-text" class="bar-status-text">loading</span>
    </div>
    <div class="bar-actions">
      <button id="theme" class="control-button" type="button">Light</button>
      <button id="clear" class="control-button" type="button">Clear</button>
    </div>
  </div>
</header>
<div class="workspace">
  <section class="machine-window" aria-label="modus console">
    <div class="window-titlebar">
      <span class="window-title">console</span>
      <span class="window-meta">console.image &middot; WebAssembly</span>
    </div>
    <main id="output" aria-live="polite" aria-label="output"></main>
    <div id="status-bar" hidden>
      <span id="status-text"></span>
      <span id="status-track"><span id="status-fill"></span></span>
      <span id="status-count"></span>
    </div>
    <div id="prompt-area">
      <div id="completion-popup" role="listbox" hidden></div>
      <div id="prompt-bar" tabindex="0" role="textbox" aria-label="modus console"></div>
      <div id="hint-bar"></div>
    </div>
    <div id="chips" hidden><span class="chips-label">Try:</span></div>
  </section>
</div>
<script type="module" src="./browser_machine_console_page.js"></script>
</body>
</html>
