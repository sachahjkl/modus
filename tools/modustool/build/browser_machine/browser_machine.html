<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Desktop - modus</title>
<meta name="description" content="Run the full modus desktop directly in the browser on the WebAssembly kernel.">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="stylesheet" href="../browser_machine.css">
</head>
<body class="page-desktop">
<header class="site-bar">
  <div class="site-bar-inner">
    <a class="brand-link" href="../"><span class="brand-mark" aria-hidden="true"></span>modus</a>
    <nav class="site-nav" aria-label="Site">
      <a class="nav-link" href="../try/">Try</a>
      <a class="nav-link" href="../console/">Web Console</a>
      <a class="nav-link" href="../desktop/" aria-current="page">Web Desktop</a>
    </nav>
    <div class="bar-status" role="status">
      <span id="dot" class="status-dot idle"></span>
      <span id="machine-status" class="bar-status-text">ready</span>
    </div>
    <div class="bar-actions">
      <button id="theme" class="control-button" type="button">Light</button>
      <button id="fullscreen" class="control-button" type="button">Fullscreen</button>
      <button id="start" class="control-button primary" type="button">Start</button>
    </div>
  </div>
</header>
<main class="workspace">
  <section class="machine-window" aria-label="modus desktop">
    <div class="window-titlebar">
      <span class="window-title">desktop</span>
      <span id="screen-meta" class="window-meta">boot.image &middot; 1280 &times; 800</span>
    </div>
    <div id="stage-frame" class="stage-frame">
      <canvas id="screen" width="1280" height="800" tabindex="0" aria-label="The screen of the machine"></canvas>
    </div>
  </section>
  <details class="serial-panel">
    <summary>Serial log (COM1)</summary>
    <pre id="serial-output" aria-label="The serial port"></pre>
  </details>
</main>
<script type="module" src="../browser_machine_page.js"></script>
</body>
</html>
