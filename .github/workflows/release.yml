# The release workflow: on a tag v<release number>, the full check of the
# commit, then the tool builds the release volume with the keys of the
# publisher, then the files of the release go on the release of the tag
# (docs/INSTALL.md, src/md/infrastructure/release_image.md). Each step
# calls the tool, Nix or an action; the workflow holds no logic of its own.
#
# Each action is pinned by the commit of its version. No cache action runs
# here: the cache daemon and its post step would run while the keys are on
# the disk of the runner. The keys are secrets of the environment
# `release`, which only a tag v* may use (secrets/README.md). The runner
# must be a hosted runner: it is discarded after the job, with the key
# folder.
name: release

on:
  push:
    tags: ["v*"]

# One release at a time for one tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The release ships the bytes that the tests ran: the full check of the
  # tagged commit, with no secret.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check

  # The keys exist only in this job, which cannot write to the repository.
  build:
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # The tag must name the release number of the commit.
      - run: nix develop -c modustool release tag-check "$GITHUB_REF_NAME"
      # The key folder, outside the repository, from the secrets of the
      # environment release (secrets/README.md).
      - run: nix develop -c modustool key write "$RUNNER_TEMP/keys"
        env:
          SYSTEM_SIGNING_KEY_TEXT: ${{ secrets.SYSTEM_SIGNING_KEY }}
          FIRMWARE_SIGNING_KEY_TEXT: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          FIRMWARE_CERTIFICATE_TEXT: ${{ secrets.FIRMWARE_CERTIFICATE }}
          RELEASE_SIGNING_KEY_TEXT: ${{ secrets.RELEASE_SIGNING_KEY }}
      # The whole build, the release volume, and dist/: the image, the
      # checksum list and its release signature; the notes of the release.
      - run: nix develop -c modustool release image
        env:
          SYSTEM_SIGNING_KEY: ${{ runner.temp }}/keys/signing_key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            build/release_notes.md
          if-no-files-found: error

  # Only this job writes to the repository. It holds no key, and runs no
  # code of the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file build/release_notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
