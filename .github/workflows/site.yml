# The site of the system: modustool builds it, GitHub Pages serves it at
# the domain that the settings of the repository name (docs/SITE.md, "How
# the site is published"). Each step calls the tool or an action; the
# workflow holds no logic of its own.
name: site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a run that started is not cancelled, so that
# no deployment stops halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nixbuild/nix-quick-install-action@v35
      # The store of the development shell, with the LLVM, the QEMU and the
      # Odin that the flake builds, back from the last run with the same
      # flake.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: site-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: site-${{ runner.os }}-
      # The boot image gives the tiles of the home, the sizes of the module
      # pages and the column "in the boot image" of the licenses.
      - run: nix develop -c modustool build
      - run: nix develop -c modustool site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
