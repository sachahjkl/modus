# The check of each push: `nix flake check`, the checks of the flake (the
# hooks, and `modustool check` in an empty folder, with the machine
# tests). Each step calls the tool, Nix or an action; the workflow holds no
# logic of its own.
name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push of the same branch makes an older check useless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Each action is pinned by the commit of its version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # The flake builds its own LLVM, QEMU, OVMF and Odin, which no public
      # cache holds: the store of the last run with the same flake comes
      # back from the cache of GitHub Actions, so that they are built once.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: check-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: check-${{ runner.os }}-
      # Nix goes on past a failed test part, and the list names each one
      # with its first failed step. Bound concurrent jobs to 2 so a 4-vCPU
      # runner does not starve while running QEMU machine tests.
      - run: nix flake check --keep-going --max-jobs 2
      - if: failure()
        run: nix develop -c modustool failed_parts
